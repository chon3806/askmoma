name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # The optional extras: installs embedding search and the small LLM (CPU-only
  # PyTorch) and runs the tests marked `embeddings` or `llm`, which the job above skips.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-smollm2-135m
      - name: Install with all extras
        run: uv sync --locked --all-extras
      - name: Check the extras are importable
        run: uv run python -c "import faiss, sentence_transformers, transformers, torch; print(torch.__version__)"
      - name: Test embedding search and the LLM layer
        run: uv run pytest -m "embeddings or llm"
