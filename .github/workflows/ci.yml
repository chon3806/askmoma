name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # Search with sentence embeddings: installs the `embeddings` extra (CPU-only
  # PyTorch) and runs the tests marked `embeddings`, which the job above skips.
  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install with the embeddings extra
        run: uv sync --locked --extra embeddings
      - name: Check the extra is importable
        run: uv run python -c "import faiss, sentence_transformers, torch; print(torch.__version__)"
      - name: Test search with embeddings
        run: uv run pytest -m embeddings
