[project]
name = "askmoma"
version = "0.1.0"
description = "A conversational guide to the art on view at the Museum of Modern Art (MSAI-631-M80 Group 4)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dipu Biswas" },
    { name = "Heman Chongbang Limbu" },
    { name = "Sarina Tamang" },
    { name = "Soham Nitin Ghorpade" },
    { name = "Xinran Peng" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "gradio>=6.32,<7",
]

[project.optional-dependencies]
# Search by description with sentence embeddings (all-MiniLM-L6-v2) and FAISS.
# Without this extra, search.py falls back to TF-IDF. Install with
# `uv sync --extra embeddings` (or `mise run setup-full`).
embeddings = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "torch>=2.4",
]

[project.scripts]
askmoma = "askmoma.__main__:main"

# PyTorch's CPU-only wheels: a laptop needs no GPU for MiniLM, and they are a
# fraction of the size of the default CUDA build. macOS wheels on PyPI are
# already CPU builds, so it keeps PyPI there.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["askmoma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "embeddings: needs the `embeddings` extra and the MiniLM model (skipped when not installed)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, and common bugs.
select = ["E", "F", "I", "UP", "B"]
# `ruff format` already wraps code at line-length; what is left over 110 are CSS,
# regex and URL strings that cannot be split without hurting readability.
ignore = ["E501"]
